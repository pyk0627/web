<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <style>
        body
        {
            display:flex;
            /*水平居中*/
            justify-content:center;
            /*垂直居中*/
            align-items:center;
            /*把body的最小高度设置为100%的视口高度*/
            min-height:100vh;
            /*清除浏览器的默认边距*/
            margin:0;
        }

        /*表格，每一行，数据，不要是.btn-row这一行起作用*/
        table tr td:first-child:not(.btn-row)
        {
            /*文字右对齐*/
            text-align:right;
            padding-right:15px;
            width:100px;
        }
        table tr td:last-child
        {
            width:200px;
        }
        input[type="text"],
        input[type="password"],
        select
        {
            width:100%;
            /*让宽度包含边框和内边距，防止溢出*/
            box-sizing:border-box;
        }
        
        .btn-row
        {
            text-align:center;
        }
    </style>
    
    <script defer>
    </script>
</head>
<body>
	<!-- 
		表单，收集数据
		需要提交给服务器的数据用name
		需要用javascript/css找到这个元素，用id
		都需要，都用 -->
    <form name="f1">
    	<!-- 创建一个表格，表格边框宽度为1像素，表格总宽度为600像素 -->
        <table border="1" width="600">
            <tr>
                <th colspan="3">
                    <h1>用户注册</h1>
                </th>
            </tr>
            <tr>
                <td><label>用户名：</label></td>
                <!-- 用户输入 -->
                <td><input type="text" name="user" id="us1"></td>
                <!-- 用户名标签 -->
                <td><label id="yhm">用户名由3-5个字符构成</label></td>
            </tr>
            <tr>
                <td><label>密码：</label></td>
                <td><input type="password" name="pass1" id="pass1"></td>
                <td><label>请输出8到12位密码</label></td>
            </tr>
            <tr>
                <td><label>确认密码：</label></td>
                <td><input type="password" name="pass2"></td>
                <td><label>密码是否一致</label></td>
            </tr>
            <tr>
                <td><label>E-mail：</label></td>
                <td><input type="text" name="e_mail"></td>
                <td><label>请输入有效的E-mail</label></td>
            </tr>
            <tr>
                <td><label>手机号码：</label></td>
                <td><input type="text" name="tel"></td>
                <td><label>请输入手机号码</label></td>
            </tr>
            <tr>
                <td><label>真实姓名：</label></td>
                <td><input type="text" name="realName"></td>
                <td><label>请输入真实姓名</label></td>
            </tr>
            <tr>
                <td><label>省份：</label></td>
                <td>
                    <select name="home">
                        <option value="">--请选择--</option>
                        <option value="北京市">北京市</option>
                        <option value="天津市">天津市</option>
                        <option value="河北省">河北省</option>
                        <option value="山西省">山西省</option>
                        <option value="内蒙古自治区">内蒙古自治区</option>
                        <option value="辽宁省">辽宁省</option>
                        <option value="吉林省">吉林省</option>
                        <option value="黑龙江省">黑龙江省</option>
                        <option value="上海市">上海市</option>
                        <option value="江苏省">江苏省</option>
                        <option value="浙江省">浙江省</option>
                        <option value="安徽省">安徽省</option>
                        <option value="福建省">福建省</option>
                        <option value="江西省">江西省</option>
                        <option value="山东省">山东省</option>
                        <option value="河南省">河南省</option>
                        <option value="湖北省">湖北省</option>
                        <option value="湖南省">湖南省</option>
                        <option value="广东省">广东省</option>
                        <option value="广西壮族自治区">广西壮族自治区</option>
                        <option value="海南省">海南省</option>
                        <option value="重庆市">重庆市</option>
                        <option value="四川省">四川省</option>
                        <option value="贵州省">贵州省</option>
                        <option value="云南省">云南省</option>
                        <option value="西藏自治区">西藏自治区</option>
                        <option value="陕西省">陕西省</option>
                        <option value="甘肃省">甘肃省</option>
                        <option value="青海省">青海省</option>
                        <option value="宁夏回族自治区">宁夏回族自治区</option>
                        <option value="新疆维吾尔自治区">新疆维吾尔自治区</option>
                        <option value="台湾省">台湾省</option>
                        <option value="香港特别行政区">香港特别行政区</option>
                        <option value="澳门特别行政区">澳门特别行政区</option>
                    </select>
                </td>
                <td><label>请选择省份</label></td>
            </tr>
            <tr>
                <td><label>技术方向：</label></td>
                <td>
                    <input type="checkbox" name="tech" value="Java">Java
                    <input type="checkbox" name="tech" value="JavaScript" checked>JavaScript
                    <input type="checkbox" name="tech" value="PHP">PHP 
                    <input type="checkbox" name="tech" value=".NET">.NET
                    <input type="checkbox" name="tech" value="IOS">IOS
                    <input type="checkbox" name="tech" value="Android">Android
                    <input type="checkbox" name="tech" value="wangye">网页
                </td>
                <td><label>请选择技术方向</label></td>
            </tr>
            <tr>
                <td><label>岗位：</label></td>
                <td>
                    <input type="radio" name="position" value="0">前端
                    <input type="radio" name="position" value="1" checked>后端
                    <input type="radio" name="position" value="2">测试
                </td>
                <td><label>请选择岗位</label></td>
            </tr>
            <tr>
               <!-- 真正装着按钮的td，不是tr-->
               <td colspan="3" class="btn-row">
                    <button onclick="show()">注册</button>
                    <button type="reset">重置</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
