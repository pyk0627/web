<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${mode == 'create' ? '新增作物' : '编辑作物'})}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>
<div th:replace="~{admin/fragments :: adminNav('crops')}"></div>
<div th:replace="~{fragments/common :: flash}"></div>

<main class="container py-4 py-lg-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/admin}">后台</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/crops}">作物维护</a></li>
            <li class="breadcrumb-item active" th:text="${mode == 'create' ? '新增作物' : '编辑作物'}">新增作物</li>
        </ol>
    </nav>

    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <span class="section-kicker">植物档案</span>
            <h1 class="h2 fw-bold mb-1" th:text="${mode == 'create' ? '新增作物' : '编辑作物'}">新增作物</h1>
            <p class="text-muted mb-0">带 <span class="text-danger">*</span> 的字段为必填项。</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/admin/crops}">返回列表</a>
    </div>

    <div class="content-card">
        <form th:action="@{${mode == 'create' ? '/admin/crops' : '/admin/crops/' + cropForm.id}}"
              th:object="${cropForm}" method="post" class="needs-validation" novalidate>
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">保存失败</div>
            </div>

            <div class="row g-4">
                <div class="col-lg-8">
                    <h2 class="h6 fw-bold border-bottom pb-2 mb-3">基本信息</h2>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="chineseName" class="form-label">中文名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="chineseName" th:field="*{chineseName}"
                                   required maxlength="100" placeholder="例如：苏铁">
                            <div class="invalid-feedback">请输入中文名</div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('chineseName')}"
                                 th:errors="*{chineseName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="alias" class="form-label">别名</label>
                            <input type="text" class="form-control" id="alias" th:field="*{alias}"
                                   maxlength="200" placeholder="例如：铁树">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('alias')}"
                                 th:errors="*{alias}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="englishName" class="form-label">英文名</label>
                            <input type="text" class="form-control" id="englishName" th:field="*{englishName}"
                                   maxlength="150" placeholder="例如：Sago Palm">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('englishName')}"
                                 th:errors="*{englishName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="latinName" class="form-label">拉丁学名</label>
                            <input type="text" class="form-control" id="latinName" th:field="*{latinName}"
                                   maxlength="150" placeholder="例如：Cycas revoluta Thunb.">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('latinName')}"
                                 th:errors="*{latinName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="family" class="form-label">科 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="family" th:field="*{family}"
                                   list="familyList" required maxlength="100" placeholder="例如：苏铁科">
                            <datalist id="familyList">
                                <option th:each="f : ${families}" th:value="${f}"></option>
                            </datalist>
                            <div class="invalid-feedback">请输入科名</div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('family')}"
                                 th:errors="*{family}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="genus" class="form-label">属 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="genus" th:field="*{genus}"
                                   list="genusList" required maxlength="100" placeholder="例如：苏铁属">
                            <datalist id="genusList">
                                <option th:each="g : ${genera}" th:value="${g}"></option>
                            </datalist>
                            <div class="invalid-feedback">请输入属名</div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('genus')}"
                                 th:errors="*{genus}"></div>
                        </div>
                    </div>

                    <h2 class="h6 fw-bold border-bottom pb-2 mb-3 mt-4">知识内容</h2>
                    <div class="mb-3">
                        <label for="features" class="form-label">形态特征</label>
                        <textarea class="form-control" id="features" th:field="*{features}" rows="4"
                                  maxlength="4000" placeholder="描述植物的形态特征"></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('features')}"
                             th:errors="*{features}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="distribution" class="form-label">分布与生境</label>
                        <textarea class="form-control" id="distribution" th:field="*{distribution}" rows="3"
                                  maxlength="4000" placeholder="描述分布地区、海拔和生境"></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('distribution')}"
                             th:errors="*{distribution}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="cultivation" class="form-label">栽培要点</label>
                        <textarea class="form-control" id="cultivation" th:field="*{cultivation}" rows="3"
                                  maxlength="4000" placeholder="描述繁殖、栽培和养护方法"></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('cultivation')}"
                             th:errors="*{cultivation}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="uses" class="form-label">主要用途</label>
                        <textarea class="form-control" id="uses" th:field="*{uses}" rows="3"
                                  maxlength="4000" placeholder="描述食用、药用、工业或园林用途"></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('uses')}"
                             th:errors="*{uses}"></div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <h2 class="h6 fw-bold border-bottom pb-2 mb-3">图片与资料</h2>
                    <div class="mb-3">
                        <label for="imageUrl" class="form-label">图片地址</label>
                        <input type="text" class="form-control" id="imageUrl" th:field="*{imageUrl}"
                               maxlength="255" placeholder="/images/crops/xxx.svg"
                               data-image-input>
                        <div class="form-text">支持本地路径或 http(s) 图片链接。</div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('imageUrl')}"
                             th:errors="*{imageUrl}"></div>
                    </div>
                    <div class="image-preview-box mb-4">
                        <img th:src="${cropForm.imageUrl != null and !cropForm.imageUrl.isBlank() ? cropForm.imageUrl : '/images/crops/placeholder.svg'}"
                             alt="图片预览" data-image-preview>
                        <span class="small text-muted">图片预览</span>
                    </div>

                    <div class="mb-3">
                        <label for="referenceTitle" class="form-label">参考资料标题</label>
                        <input type="text" class="form-control" id="referenceTitle" th:field="*{referenceTitle}"
                               maxlength="200" placeholder="例如：中国植物志">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('referenceTitle')}"
                             th:errors="*{referenceTitle}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="referenceUrl" class="form-label">参考资料链接</label>
                        <input type="url" class="form-control" id="referenceUrl" th:field="*{referenceUrl}"
                               maxlength="500" placeholder="https://...">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('referenceUrl')}"
                             th:errors="*{referenceUrl}"></div>
                    </div>

                    <div class="alert alert-light border small">
                        <strong>提示：</strong>新增作物后，可以在“含油率数据”页面为该作物添加多条测试记录。
                    </div>
                </div>
            </div>

            <hr class="my-4">
            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-success"
                        th:text="${mode == 'create' ? '保存并新增' : '保存修改'}">保存</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/crops}">取消</a>
                <a th:if="${mode == 'edit'}" class="btn btn-outline-success ms-auto"
                   th:href="@{/admin/oils(cropId=${cropForm.id})}">管理该作物的含油率数据</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
