<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('含油率数据')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>
<div th:replace="~{admin/fragments :: adminNav('oils')}"></div>
<div th:replace="~{fragments/common :: flash}"></div>

<main class="container py-4 py-lg-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <span class="section-kicker">化学组分</span>
            <h1 class="h2 fw-bold mb-1">含油率数据</h1>
            <p class="text-muted mb-0">一条记录对应一次采集/测试结果，同一作物可以有多条记录。</p>
        </div>
        <a class="btn btn-success" th:href="@{/admin/oils/new(cropId=${selectedCropId})}">＋ 新增记录</a>
    </div>

    <div class="content-card">
        <form class="row g-2 mb-3" th:action="@{/admin/oils}" method="get">
            <div class="col-md-4">
                <select class="form-select" name="cropId">
                    <option value="">全部作物</option>
                    <option th:each="crop : ${cropOptions}" th:value="${crop.id}" th:text="${crop.chineseName}"
                            th:selected="${selectedCropId != null and crop.id == selectedCropId}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <input type="search" class="form-control" name="keyword" th:value="${keyword}"
                       placeholder="产地、采集单位、测试单位">
            </div>
            <div class="col-auto">
                <button class="btn btn-outline-success" type="submit">筛选</button>
            </div>
            <div class="col-auto">
                <a class="btn btn-outline-secondary" th:href="@{/admin/oils}">清空</a>
            </div>
            <div class="col-auto ms-auto text-muted small align-self-center">
                共 <strong th:text="${oilRecords.size()}">0</strong> 条
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>作物</th>
                    <th>采集 / 测试单位</th>
                    <th>部位</th>
                    <th>产地</th>
                    <th class="text-end">含油率(%)</th>
                    <th class="text-end">碘值</th>
                    <th class="text-end">酸值</th>
                    <th class="text-end">皂化值</th>
                    <th class="text-end">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${oilRecords}">
                    <td>
                        <a class="text-success text-decoration-none fw-semibold"
                           th:href="@{/crop/{id}(id=${r.cropId})}" th:text="${r.cropName}">苏铁</a>
                    </td>
                    <td class="small text-muted">
                        <span th:text="${r.collectionUnit ?: '—'}">GXIB</span> /
                        <span th:text="${r.testUnit ?: '—'}">SCBG</span>
                    </td>
                    <td class="small" th:text="${r.testPart ?: '—'}">种仁</td>
                    <td class="small" th:text="${r.origin ?: '—'}">广西桂林</td>
                    <td class="text-end fw-semibold text-success" th:text="${r.oilContent ?: '—'}">10.65</td>
                    <td class="text-end small" th:text="${r.iodineValue ?: '—'}">71.29</td>
                    <td class="text-end small" th:text="${r.acidValue ?: '—'}">1.25</td>
                    <td class="text-end small" th:text="${r.saponificationValue ?: '—'}">234.13</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-success"
                           th:href="@{/admin/oils/{id}/edit(id=${r.id})}">编辑</a>
                        <form class="d-inline" th:action="@{/admin/oils/{id}/delete(id=${r.id})}" method="post"
                              data-confirm="确定删除这条含油率记录吗？">
                            <button class="btn btn-sm btn-outline-danger" type="submit">删除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-inline mt-3" th:if="${oilRecords.isEmpty()}">暂无符合条件的含油率记录。</div>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
