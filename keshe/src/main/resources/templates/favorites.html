<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('我的收藏')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>
<div th:replace="~{fragments/common :: flash}"></div>

<header class="page-banner">
    <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3">
            <div>
                <span class="section-kicker">个人学习清单</span>
                <h1 class="display-6 fw-bold mb-2">我的收藏</h1>
                <p class="text-muted mb-0">把感兴趣的植物集中在这里，方便复习和比较。</p>
            </div>
            <div class="banner-stat">
                <span>已收藏</span>
                <strong th:text="${favoriteCrops.size()}">0</strong>
                <span>种</span>
            </div>
        </div>
    </div>
</header>

<main class="container py-4 py-lg-5">
    <div class="row g-4" th:if="${!favoriteCrops.isEmpty()}">
        <div class="col-md-6 col-lg-4" th:each="crop : ${favoriteCrops}">
            <article class="crop-card h-100">
                <a th:href="@{/crop/{id}(id=${crop.id})}" class="crop-card-image-wrap">
                    <img class="crop-card-image" th:src="${crop.imageUrl}" th:alt="${crop.chineseName}">
                    <span class="crop-oil-badge" th:text="${crop.oilSummary}">10%</span>
                </a>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <div>
                            <h2 class="h5 mb-1">
                                <a class="stretched-link text-reset text-decoration-none"
                                   th:href="@{/crop/{id}(id=${crop.id})}" th:text="${crop.chineseName}">苏铁</a>
                            </h2>
                            <div class="text-muted small fst-italic" th:text="${crop.latinName}">Cycas</div>
                        </div>
                        <span class="family-pill" th:text="${crop.family}">苏铁科</span>
                    </div>
                    <p class="text-muted small mt-3 mb-0"
                       th:text="${crop.features != null ? #strings.abbreviate(crop.features, 80) : '暂无描述'}">描述</p>
                </div>
            </article>
        </div>
    </div>

    <div class="empty-state" th:if="${favoriteCrops.isEmpty()}">
        <div class="empty-icon">☆</div>
        <h2 class="h4">收藏夹还是空的</h2>
        <p class="text-muted mb-4">在植物详情页点击“收藏植物”，就能把喜欢的植物加入这里。</p>
        <a class="btn btn-success" th:href="@{/search}">去浏览植物</a>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
