<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('403 无权限')}"></head>
<body class="error-page">
<main class="container">
    <div class="error-card">
        <div class="error-code">403</div>
        <h1 class="h3 fw-bold">没有访问权限</h1>
        <p class="text-muted">该页面只允许管理员访问。如果你认为这是误判，请确认当前登录账号的角色。</p>
        <div class="d-flex justify-content-center gap-2">
            <a class="btn btn-success" th:href="@{/}">返回首页</a>
            <a class="btn btn-outline-secondary" th:href="@{/login}">切换账号</a>
        </div>
    </div>
</main>
</body>
</html>
