<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('404 页面不存在')}"></head>
<body class="error-page">
<main class="container">
    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="h3 fw-bold">页面不存在</h1>
        <p class="text-muted">你访问的页面可能已被删除，或者链接地址有误。</p>
        <div class="d-flex justify-content-center gap-2">
            <a class="btn btn-success" th:href="@{/}">返回首页</a>
            <a class="btn btn-outline-secondary" th:href="@{/search}">去查询植物</a>
        </div>
    </div>
</main>
</body>
</html>
