<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('500 服务器错误')}"></head>
<body class="error-page">
<main class="container">
    <div class="error-card">
        <div class="error-code">500</div>
        <h1 class="h3 fw-bold">服务器开小差了</h1>
        <p class="text-muted">请稍后重试。如果问题持续出现，请查看控制台日志或联系管理员。</p>
        <div class="d-flex justify-content-center gap-2">
            <a class="btn btn-success" th:href="@{/}">返回首页</a>
            <a class="btn btn-outline-secondary" th:href="@{/search}">去查询植物</a>
        </div>
    </div>
</main>
</body>
</html>
